name: DB Backup

on:
  schedule:
    # 매일 자정(KST)
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DUMP_FILE="db-$(date -u +%Y-%m-%d).dump"
          echo "DUMP_FILE=${DUMP_FILE}" >> "$GITHUB_ENV"
          "$PG_BIN/pg_dump" "$DATABASE_URL" --format=custom --file="$DUMP_FILE"
          ls -lh "$DUMP_FILE"

      - name: Verify dump integrity
        run: '"$PG_BIN/pg_restore" --list "$DUMP_FILE" > /dev/null'

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: aws s3 cp "$DUMP_FILE" "s3://${S3_BUCKET_NAME}/db-backups/daily/${DUMP_FILE}"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MONITORING_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"🚨 *DB Backup 실패*\n<${RUN_URL}|워크플로우 로그 확인>\"}"
